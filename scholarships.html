<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ทุนการศึกษาและทุนวิจัย — BUU | FSS คณะวิทยาศาสตร์การกีฬา</title>
  <meta name="description" content="ประกาศทุนการศึกษาและทุนวิจัย กำหนดปิดรับสมัคร และไฟล์เอกสารแนบ คณะวิทยาศาสตร์การกีฬา มหาวิทยาลัยบูรพา" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .scholarship-grid {
      display: grid;
      gap: 0.75rem;
    }
    .scholarship-card {
      background: var(--color-white);
      border: 1px solid var(--color-gray-light);
      border-left: 4px solid var(--color-yellow);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .scholarship-card .sch-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-gray-dark);
      margin: 0;
    }
    .scholarship-card .sch-type {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-green);
      margin: 0;
    }
    .scholarship-card .sch-meta {
      font-size: 1rem;
      color: var(--color-gray-medium);
      margin: 0;
    }
    .scholarship-card .sch-detail {
      font-size: 1rem;
      color: var(--color-gray-dark);
      margin: 0;
      line-height: 1.6;
    }
    .scholarship-card .sch-deadline {
      font-size: 1rem;
      font-weight: 700;
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px solid var(--color-gray-light);
    }
    .scholarship-card .sch-deadline.expired { color: var(--color-danger); }
    .scholarship-card .sch-file {
      font-size: 0.9rem;
      color: var(--color-gray-medium);
      margin: 0.25rem 0 0;
    }
    .scholarship-card .sch-file a {
      color: var(--color-green);
      text-decoration: underline;
    }
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--color-gray-medium);
    }
    .badge-open {
      background: var(--color-green-soft);
      color: var(--color-green);
      padding: 0.1rem 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .badge-closed {
      background: #FEE2E2;
      color: var(--color-danger);
      padding: 0.1rem 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }
  </style>
</head>
<body data-page="scholarships">

  <!-- ส่วนหัวเว็บ ( สร้างอัตโนมัติโดย js/layout.js ) -->
  <div id="site-header"></div>

  <main class="page-main">

    <section class="content-section-card" aria-labelledby="scholarship-title">
      <div class="section-head gold">
        <h1 id="scholarship-title" class="text-section-title">ทุนการศึกษาและทุนวิจัย</h1>
      </div>
      <p class="text-meta">
        ประกาศทุนการศึกษาและทุนวิจัย พร้อมกำหนดปิดรับสมัครและไฟล์เอกสารแนบสำหรับดาวน์โหลด
      </p>

      <div id="scholarship-list" class="scholarship-grid"></div>
      <p id="scholarship-empty" class="empty-state" style="display:none;">ยังไม่มีประกาศทุนในระบบค่ะ</p>
    </section>

  </main>

  <!-- ส่วนท้ายเว็บ -->
  <div id="site-footer"></div>

  <!-- คลัง supabase-js จาก CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/layout.js?v=1"></script>
  <script src="js/sample-data.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script src="js/scholarships.js?v=1"></script>

  <script src="js/chatbot.js?v=4"></script>
</body>
</html>
