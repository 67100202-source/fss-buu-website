<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อาจารย์และเจ้าหน้าที่ — BUU | FSS คณะวิทยาศาสตร์การกีฬา</title>
  <meta name="description" content="ทำเนียบอาจารย์ประจำคณะและบุคลากรสำนักงานคณบดี คณะวิทยาศาสตร์การกีฬา มหาวิทยาลัยบูรพา" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* กรอบรูปอาจารย์: รูปด้านซ้าย ข้อมูลด้านขวา */
    .faculty-card {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }
    .faculty-photo {
      flex: 0 0 96px;
      width: 96px;
      height: 120px;
      border: 2px solid var(--color-green, #2e7d32);
      border-radius: 8px;
      overflow: hidden;
      background: var(--color-gray-bg, #f5f5f5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .faculty-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .faculty-photo-placeholder {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--color-green, #2e7d32);
    }
    .faculty-info { flex: 1; min-width: 0; }
    /* แท็บสาขาวิชา: ขึ้นบรรทัดใหม่เมื่อพื้นที่ไม่พอ (ไม่ใช้ scroll bar) */
    .dept-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.5rem;
      border-bottom: 1px solid var(--color-gray-light, #e0e0e0);
      margin-bottom: 1rem;
    }
    .dept-tab {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 0.9rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-gray-medium, #666);
      cursor: pointer;
      white-space: nowrap;
    }
    .dept-tab.is-active {
      color: var(--color-green, #2e7d32);
      border-bottom-color: var(--color-green, #2e7d32);
    }
    /* การ์ดอาจารย์: 1 คอลัมน์บนมือถือ, 2 คอลัมน์บนจอใหญ่ */
    .faculty-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    @media (min-width: 640px) {
      .faculty-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body data-page="faculty">

  <!-- ส่วนหัวเว็บ ( สร้างอัตโนมัติโดย js/layout.js ) -->
  <div id="site-header"></div>

  <main class="page-main">

    <!-- แถบเตือนข้อมูลตัวอย่าง -->
    <p class="sample-notice">
      ⚠️ หน้านี้กำลังแสดง<strong>ข้อมูลตัวอย่าง</strong>เพื่อการพัฒนา —
      เมื่อเชื่อมฐานข้อมูล Supabase แล้วจะดึงข้อมูลจริงมาแสดงแทน
    </p>

    <!-- ============ ทำเนียบอาจารย์ประจำคณะ ============ -->
    <section class="content-section-card" aria-labelledby="faculty-title">
      <div class="section-head green">
        <h1 id="faculty-title" class="text-section-title" data-i18n="page.faculty">ทำเนียบอาจารย์ประจำคณะ</h1>
      </div>

      <!-- ช่องค้นหาอาจารย์ (ฟีเจอร์บังคับ: ค้นหาชื่ออาจารย์ด้วยภาษาไทยได้จริง) -->
      <div class="search-box" style="margin-bottom: 1rem;">
        <input
          type="search"
          id="faculty-search"
          class="search-input"
          placeholder="ค้นหาชื่ออาจารย์หรือสาขาวิชา..."
          data-i18n-placeholder="search.faculty"
          aria-label="ค้นหาชื่ออาจารย์"
        />
      </div>

      <!-- แท็บแยกตามสาขาวิชา -->
      <div id="dept-tabs" class="dept-tabs" role="tablist"></div>

      <div id="faculty-list" class="faculty-grid"></div>
    </section>


  </main>

  <!-- ส่วนท้ายเว็บ -->
  <div id="site-footer"></div>

  <!-- คลัง supabase-js จาก CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/layout.js?v=1"></script>
  <script src="js/sample-data.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script src="js/faculty.js?v=1"></script>

  <script src="js/chatbot.js?v=3"></script>
</body>
</html>
