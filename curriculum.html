<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>หลักสูตรที่เปิดสอน — BUU | FSS คณะวิทยาศาสตร์การกีฬา</title>
  <meta name="description" content="ข้อมูลหลักสูตรแต่ละสาขาวิชาและทำเนียบอาจารย์ประจำคณะวิทยาศาสตร์การกีฬา มหาวิทยาลัยบูรพา" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* แท็บระดับการศึกษา: ขึ้นบรรทัดใหม่เมื่อพื้นที่ไม่พอ (ไม่ใช้ scroll bar) */
    .dept-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.5rem;
      border-bottom: 1px solid var(--color-gray-light, #e0e0e0);
      margin-bottom: 1rem;
    }
    .dept-tab {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 0.9rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-gray-medium, #666);
      cursor: pointer;
      white-space: nowrap;
    }
    .dept-tab.is-active {
      color: var(--color-green, #2e7d32);
      border-bottom-color: var(--color-green, #2e7d32);
    }
  </style>
</head>
<body data-page="curriculum">

  <!-- ส่วนหัวเว็บ ( สร้างอัตโนมัติโดย js/layout.js ) -->
  <div id="site-header"></div>

  <main class="page-main">

    <!-- ============ หลักสูตรที่เปิดสอน ============ -->
    <section class="content-section-card" aria-labelledby="curriculum-title">
      <div class="section-head green">
        <h1 id="curriculum-title" class="text-section-title" data-i18n="page.curriculum">หลักสูตรที่เปิดสอน (Programs)</h1>
      </div>
      <p class="text-meta">
        คณะวิทยาศาสตร์การกีฬา เปิดสอนหลักสูตรตั้งแต่ระดับปริญญาตรีถึงปริญญาเอก
        (หลักสูตรปรับปรุง พ.ศ. 2559, 2564 และ 2569)
      </p>
      <!-- แท็บระดับการศึกษา -->
      <div id="level-tabs" class="dept-tabs" role="tablist"></div>

      <div id="course-list"></div>
    </section>

    <!-- ============ ลิงก์ไปหน้าอาจารย์และเจ้าหน้าที่ ============ -->
    <div style="text-align:center;margin:1rem 0;">
      <a href="faculty.html" class="btn btn-outline">ดูอาจารย์และเจ้าหน้าที่ →</a>
    </div>

  </main>

  <!-- ส่วนท้ายเว็บ -->
  <div id="site-footer"></div>

  <!-- คลัง supabase-js จาก CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/layout.js?v=1"></script>
  <script src="js/sample-data.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script src="js/documents-data.js?v=1"></script>
  <script src="js/curriculum.js?v=1"></script>

  <script src="js/chatbot.js?v=4"></script>
</body>
</html>
