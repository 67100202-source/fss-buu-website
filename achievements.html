<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลงานนิสิตและศิษย์เก่า — BUU | FSS คณะวิทยาศาสตร์การกีฬา</title>
  <meta name="description" content="ผลงานนิสิต ศิษย์เก่า และบุคลากรที่สร้างชื่อเสียง รางวัลที่ได้รับ และเรื่องเล่าความสำเร็จ คณะวิทยาศาสตร์การกีฬา มหาวิทยาลัยบูรพา" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .achievement-grid {
      display: grid;
      gap: 0.75rem;
    }
    .achievement-card {
      background: var(--color-white);
      border: 1px solid var(--color-gray-light);
      border-left: 4px solid var(--color-green);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .achievement-card .ach-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-gray-dark);
      margin: 0;
    }
    .achievement-card .ach-person {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-gray-dark);
      margin: 0;
    }
    .achievement-card .ach-role {
      font-size: 0.95rem;
      color: var(--color-gray-medium);
      margin: 0;
    }
    .achievement-card .ach-meta {
      font-size: 1rem;
      color: var(--color-gray-medium);
      margin: 0;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .achievement-card .ach-category {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--color-green);
      background: var(--color-green-soft);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
    }
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--color-gray-medium);
    }
  </style>
</head>
<body data-page="achievements">

  <!-- ส่วนหัวเว็บ ( สร้างอัตโนมัติโดย js/layout.js ) -->
  <div id="site-header"></div>

  <main class="page-main">

    <!-- แถบเตือนข้อมูลตัวอย่าง -->
    <p class="sample-notice">
      ⚠️ หน้านี้กำลังแสดง<strong>ข้อมูลตัวอย่าง</strong>เพื่อการพัฒนา —
      เมื่อเชื่อมฐานข้อมูล Supabase แล้วจะดึงข้อมูลจริงมาแสดงแทน
    </p>

    <section class="content-section-card" aria-labelledby="achievement-title">
      <div class="section-head green">
        <h1 id="achievement-title" class="text-section-title">ผลงานนิสิตและศิษย์เก่า</h1>
      </div>
      <p class="text-meta">
        รางวัลที่ได้รับ เรื่องเล่าความสำเร็จของนิสิต ศิษย์เก่า และบุคลากรคณะ
        ทั้งในระดับชาติและนานาชาติ
      </p>

      <div id="achievement-list" class="achievement-grid"></div>
      <p id="achievement-empty" class="empty-state" style="display:none;">ยังไม่มีผลงานในระบบค่ะ</p>
    </section>

  </main>

  <!-- ส่วนท้ายเว็บ -->
  <div id="site-footer"></div>

  <!-- คลัง supabase-js จาก CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/layout.js?v=1"></script>
  <script src="js/sample-data.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script src="js/achievements.js?v=1"></script>

  <script src="js/chatbot.js?v=3"></script>
</body>
</html>
