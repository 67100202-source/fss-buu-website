<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เจ้าหน้าที่ — BUU | FSS คณะวิทยาศาสตร์การกีฬา</title>
  <meta name="description" content="บุคลากรสำนักงานคณบดี คณะวิทยาศาสตร์การกีฬา มหาวิทยาลัยบูรพา" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* กรอบรูปบุคลากร: รูปด้านซ้าย ข้อมูลด้านขวา */
    .faculty-card {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }
    .faculty-photo {
      flex: 0 0 96px;
      width: 96px;
      height: 120px;
      border: 2px solid var(--color-green, #2e7d32);
      border-radius: 8px;
      overflow: hidden;
      background: var(--color-gray-bg, #f5f5f5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .faculty-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .faculty-photo-placeholder {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--color-green, #2e7d32);
    }
    .faculty-info { flex: 1; min-width: 0; }
  </style>
</head>
<body data-page="staff">

  <div id="site-header"></div>

  <main class="page-main">

    <section class="content-section-card" aria-labelledby="staff-title">
      <div class="section-head green">
        <h1 id="staff-title" class="text-section-title" data-i18n="page.staff">บุคลากรสำนักงานคณบดี</h1>
      </div>
      <div id="staff-list"></div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/layout.js?v=1"></script>
  <script src="js/sample-data.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script src="js/staff.js?v=1"></script>

  <script src="js/chatbot.js?v=3"></script>
</body>
</html>
