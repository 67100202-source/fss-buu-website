<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตารางเรียนและปฏิทิน — BUU | FSS คณะวิทยาศาสตร์การกีฬา</title>
  <meta name="description" content="ตารางเรียนรายชั้นปี ปฏิทินกิจกรรมประจำเดือน และการแจ้งเตือนกิจกรรมของคณะวิทยาศาสตร์การกีฬา มหาวิทยาลัยบูรพา" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>

<!-- data-page บอก layout.js ว่าหน้านี้คือหน้าไหน เพื่อไฮไลต์เมนูให้ถูก -->
<body data-page="schedule">

  <!-- =====================================================================
       ส่วนหัวเว็บ ( สร้างอัตโนมัติโดย js/layout.js )
       ===================================================================== -->
  <div id="site-header"></div>

  <main class="page-main">

    <!-- แถบเตือนว่าเป็นข้อมูลตัวอย่าง -->
    <p class="sample-notice">
      ⚠️ หน้านี้กำลังแสดง<strong>ข้อมูลตัวอย่าง</strong>เพื่อการพัฒนา —
      เมื่อเชื่อมฐานข้อมูล Supabase แล้วจะดึงข้อมูลจริงมาแสดงแทน
    </p>

    <!-- =====================================================================
         โซนที่ 1 : ปฏิทินกิจกรรมรายเดือน  ( ฟีเจอร์บังคับ 2 )
         แตะที่วันที่ในปฏิทินเพื่อดูรายละเอียดกิจกรรมของวันนั้น
         ===================================================================== -->
    <section class="content-section-card" aria-labelledby="calendar-title">
      <div class="section-head gold">
        <h2 id="calendar-title" class="text-section-title">ปฏิทินกิจกรรม</h2>
        <a class="section-more" href="#activity-list">กิจกรรมทั้งหมด →</a>
      </div>

      <!-- แถบควบคุมปฏิทิน : ปุ่มย้อนเดือน / ชื่อเดือน / ปุ่มเดือนถัดไป -->
      <div class="cal-toolbar">
        <button id="cal-prev" class="cal-nav-btn" aria-label="เดือนก่อนหน้า">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <span id="cal-label" class="cal-month-label" aria-live="polite">—</span>

        <button id="cal-next" class="cal-nav-btn" aria-label="เดือนถัดไป">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- ตารางปฏิทิน ( สร้างด้วย js/calendar.js ) -->
      <div id="cal-grid" class="cal-grid" role="grid" aria-label="ปฏิทินกิจกรรม"></div>

      <!-- กล่องรายละเอียดกิจกรรมของวันที่เลือก -->
      <div id="cal-detail" class="cal-detail" aria-live="polite"></div>
    </section>

    <!-- =====================================================================
         โซนที่ 2 : รายการกิจกรรมทั้งหมดในเดือนที่เลือก
         พร้อมปุ่ม "เพิ่มลงใน Google Calendar" ( ฟีเจอร์เสริม: แจ้งเตือนกิจกรรม )
         ===================================================================== -->
    <section class="content-section-card" id="activity-list" aria-labelledby="activity-list-title">
      <div class="section-head green">
        <h2 id="activity-list-title" class="text-section-title">กิจกรรมในเดือนนี้</h2>
        <span id="activity-count" class="section-more"></span>
      </div>
      <div id="activity-month-list"></div>
    </section>

  </main>

  <!-- =====================================================================
       ส่วนท้ายเว็บ ( สร้างอัตโนมัติโดย js/layout.js )
       ===================================================================== -->
  <div id="site-footer"></div>

  <!-- คลัง supabase-js จาก CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- สคริปต์: config → layout → data → app → calendar -->
  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/layout.js?v=1"></script>
  <script src="js/sample-data.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script src="js/calendar.js?v=1"></script>

</body>
</html>
